name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core, data and catalogue (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify catalogue is reproducible from raw data
        run: python tools/verify_catalog.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test core and data layer
        run: dotnet test tests/HeatingSystems.Tests/HeatingSystems.Tests.csproj -c Release --logger "console;verbosity=normal"

  windows:
    name: Full solution incl. WPF UI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build HeatingSystems.sln -c Release
      - name: Test (including UI smoke test)
        run: dotnet test HeatingSystems.sln -c Release --no-build --logger "console;verbosity=normal"
      - name: Publish application
        # Self-contained single file: runs on any Windows 10/11 x64 PC without installing .NET.
        run: >
          dotnet publish src/HeatingSystems.App/HeatingSystems.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish
      - name: Launch published executable
        shell: pwsh
        run: |
          foreach ($f in 'HeatingSystems.exe', 'heating_catalog.db') {
            if (-not (Test-Path "publish/$f")) { throw "publish/$f is missing" }
          }
          $p = Start-Process -FilePath publish/HeatingSystems.exe -PassThru
          $title = ''
          for ($i = 0; $i -lt 30 -and -not $p.HasExited; $i++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            $title = $p.MainWindowTitle
            if ($title -like '*—*') { break }
          }
          if ($p.HasExited) { throw "Application exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          # The main window title is "Heating Systems — <project>"; an error message box has no dash.
          if ($title -notlike '*—*') { throw "Main window did not appear (window title: '$title')" }
          if (-not (Test-Path "$env:LOCALAPPDATA/HeatingSystems/heating.db")) { throw "User database was not created" }
          Write-Host "Started successfully, window title: $title"
      - uses: actions/upload-artifact@v4
        with:
          name: HeatingSystems-win-x64
          path: publish/
          if-no-files-found: error
